<!DOCTYPE html>
<html>
    <head>
        <title>Chapter 6 - The Extractor</title>
        <meta name="description" content="Website for dotevie">
        <meta name="author" content="dotevie">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            h1 {
                text-align: center;
                color: white;
                font-family: "Courier";
            }
            body {
                padding: 16px;
                max-width: 750px;
                margin-left: auto;
                margin-right: auto;
                background-color: black;
            }
            img {
                margin: auto;
                display: block;
                image-rendering: optimizeSpeed;             /* STOP SMOOTHING, GIVE ME SPEED  */
                image-rendering: -moz-crisp-edges;          /* Firefox                        */
                image-rendering: -o-crisp-edges;            /* Opera                          */
                image-rendering: -webkit-optimize-contrast; /* Chrome (and eventually Safari) */
                image-rendering: pixelated;                 /* Universal support since 2021   */
                image-rendering: optimize-contrast;         /* CSS3 Proposed                  */
                -ms-interpolation-mode: nearest-neighbor;   /* IE8+   */
            }



            /* hide page scrollbar */
            html { scrollbar-width: none; } /* Firefox */
            body { -ms-overflow-style: none; } /* IE and Edge */
            body::-webkit-scrollbar, body::-webkit-scrollbar-button { display: none; } /* Chrome */
            /* end hide page scrollbar */


        </style>
    </head>
    <body>
        <img src="images/c6_banner.png" style="width: 750px; max-width: 100%;">
        <h1>THE EXTRACTOR</h1>
        <img src="images/extractor1.png" style="width: 500px; max-width: 100%;"/>
        <img src="images/extractor2.png" style="width: 500px; max-width: 100%;"/>
